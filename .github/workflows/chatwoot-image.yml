name: Imagem Chatwoot BioSaúde

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'branding/**'
      - '.github/workflows/chatwoot-image.yml'

env:
  CHATWOOT_VERSION: v4.19.1
  IMAGE_NAME: biosaude-chatwoot
  BRAND_NAME: BioSaúde
  BRAND_SHORT: BioSaúde
  BRAND_COLOR_TOP: '#2F7994'
  BRAND_COLOR_BOTTOM: '#2F7994'
  BRAND_COLOR_BADGE: '#C0223B'
  BRAND_LOGO_FILE: source/logo-biosaude.png
  BRAND_LOGO_BOX: '40,350,985,615'
  BRAND_ICON_BOX: '320,352,704,518'
  BRAND_SMALL_ICON_BOX: '322,355,438,500'
  LOGIN_TITLE: BioSaúde
  LOGIN_PRIMARY: '#2F7994'
  LOGIN_GLOW: '#4FB3D1'
  LOGIN_ACCENT: '#C0223B'
  LOGO_VERSION: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar ícones e logos
        working-directory: branding
        run: |
          sudo apt-get install -y fonts-dejavu-core
          pip install pillow
          python generate.py

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome da imagem
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: branding
          push: true
          build-args: |
            CHATWOOT_IMAGE=chatwoot/chatwoot:${{ env.CHATWOOT_VERSION }}
            BRAND_NAME=${{ env.BRAND_NAME }}
            LOGIN_TITLE=${{ env.LOGIN_TITLE }}
            LOGO_VERSION=${{ env.LOGO_VERSION }}
            LOGIN_PRIMARY=${{ env.LOGIN_PRIMARY }}
            LOGIN_GLOW=${{ env.LOGIN_GLOW }}
            LOGIN_ACCENT=${{ env.LOGIN_ACCENT }}
          tags: |
            ${{ steps.img.outputs.ref }}:${{ env.CHATWOOT_VERSION }}
            ${{ steps.img.outputs.ref }}:${{ env.CHATWOOT_VERSION }}-${{ github.run_number }}
